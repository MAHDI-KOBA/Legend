name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join parts and unzip
        run: |
          cat legend.part* > legend.zip
          unzip -q legend.zip
      - name: Fix filename case for Linux
        working-directory: samp-android-launcher-32-64bit-1.1.3/app/src/main/cpp/multiplayer
        run: |
          ln -sf playertablist.h gui/samp_widgets/playerTabList.h
          ln -sfn Mobile game/mobile
          ln -sfn raknet vendor/RakNet
          ln -sf rgba.h game/RGBA.h
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install NDK and CMake
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"
      - name: Build APK
        working-directory: samp-android-launcher-32-64bit-1.1.3
        run: |
          chmod +x gradlew
          ./gradlew assembleVer_debugDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: legend-apk
          path: samp-android-launcher-32-64bit-1.1.3/app/build/outputs/apk/**/*.apk
